services:
  db:
    image: pgvector/pgvector:pg18
    container_name: cochee-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    image: cochee-app
    container_name: cochee-server
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  scheduler:
    build: .
    image: cochee-app
    container_name: cochee-scheduler
    entrypoint: ["python", "-m", "scripts.scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  client:
    build: .
    image: cochee-app
    container_name: cochee-client
    entrypoint: ["python", "llm_client.py"]
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      MCP_URL: http://server:8000/mcp
    depends_on:
      server:
        condition: service_healthy
    stdin_open: true
    tty: true
    profiles: ["client"]

volumes:
  pgdata: